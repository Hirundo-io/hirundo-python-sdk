name: Deploy Sphinx docs to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version. Defaults to hirundo/__init__.py"
        required: false
        type: string
  pull_request:
    types: [closed]
    paths:
      - "hirundo/__init__.py"
  push:
    branches:
      - clnt-50-fix-docs

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0 # Fetch all history for all tags and branches
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        timeout-minutes: 30
        env:
          SLEEP: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Manual docs deployment must be run from main, not ${GITHUB_REF_NAME}"
            exit 1
          fi

          uv venv
          source .venv/bin/activate
          uv sync --only-group docs --no-install-project
          # Extract version from hirundo/__init__.py with error handling
          if [ -f "hirundo/__init__.py" ]; then
            export VERSION=$(python -c "import re; content=open('hirundo/__init__.py').read(); match=re.search(r'__version__ = [\"\'](.*?)[\"\']', content); print(match.group(1) if match else 'unknown')" 2>/dev/null || echo 'unknown')
          else
            export VERSION='unknown'
          fi
          echo "Using version: $VERSION"
          if [ "$VERSION" = "unknown" ] || [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from hirundo/__init__.py (file may be missing, unreadable, or version format is invalid)"
            exit 1
          fi
          EXPECTED_VERSION="${{ inputs.version }}"
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$VERSION" ]; then
            echo "Expected version $EXPECTED_VERSION but hirundo/__init__.py contains $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          until uv pip install --no-cache-dir "hirundo==${VERSION}"; do
            echo "Can't find the version you mentioned, waiting $SLEEP seconds and retrying"
            sleep $SLEEP
            echo "finish waiting. retrying..."
          done

      - name: Sphinx multi-version build
        run: |
          source .venv/bin/activate
          TAG_NAME="v${VERSION}"
          for attempt in {1..40}; do
            if git ls-remote --exit-code --tags origin "$TAG_NAME" >/dev/null; then
              git fetch --tags --force origin
              break
            fi

            echo "Can't find tag $TAG_NAME, waiting 15 seconds and retrying ($attempt/40)"
            sleep 15
          done

          if ! git rev-parse --verify --quiet "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Error: tag $TAG_NAME was not available after waiting"
            exit 1
          fi

          git branch -a
          git tag
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          sphinx-multiversion docs docs/_build/html

          DOCS_VERSION_DIR="docs/_build/html/v${VERSION}"
          if [ ! -d "$DOCS_VERSION_DIR" ]; then
            echo "Expected generated docs at $DOCS_VERSION_DIR"
            exit 1
          fi

          cat > docs/_build/html/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <title>Redirecting to main branch docs</title>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./v${VERSION}/index.html" />
              <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-ancestors 'none'">
              <link rel="canonical" href="https://hirundo-io.github.io/hirundo/v${VERSION}/index.html" />
            </head>
          </html>
          EOF
        env:
          TZ: "UTC" # for running ACT
          API_HOST: something
          API_KEY: something
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/_build/html"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
