name: Run offline PyTest suites

# Runs tests that mock every HTTP call, so they need no secrets or network
# access and can run on pull requests (including from forks).
on:
  pull_request:
    types: [opened, synchronize, reopened, assigned]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest_offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --group dev
      - name: Run mocked LLM unlearning HTTP tests
        run: .venv/bin/pytest tests/unlearning-llm/llm_unlearning_http_test.py
