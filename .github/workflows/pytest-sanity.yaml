name: Run sanity tests with PyTest

on:
  pull_request:
    types: [opened, synchronize, reopened, assigned]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RECORDING_ARTIFACT: sdk-http-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  TEST_SELECTION: marker:recorded_integration

jobs:
  unit-and-transport:
    name: unit-transport (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run unit tests without network
        run: >-
          uv run pytest -m unit --block-network
          --allowed-hosts='^127\.0\.0\.1$'
      - name: Run localhost transport tests
        run: uv run pytest -m local_transport --block-network --allowed-hosts='^127\.0\.0\.1$'

  authenticated-probe:
    name: authenticated probe (${{ matrix.os }}, ${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Require live probe credentials
        env:
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
        run: >-
          uv run python -c "import os, sys;
          sys.exit(0 if os.environ.get('HIRUNDO_API_HOST') and
          os.environ.get('HIRUNDO_API_KEY') else 'live probe credentials are required')"
      - name: Run one authenticated HTTPS probe
        env:
          HIRUNDO_LIVE_TESTS: "1"
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
        run: uv run pytest -m authenticated_probe --disable-recording

  package:
    name: generated package and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          uv sync --group dev --group deploy
          uv run python scripts/generate_models.py
          git diff --exit-code -- hirundo/_generated
          uv run python -m build --wheel
      - name: Verify generated subpackage in installed wheel
        run: |
          uv venv "${RUNNER_TEMP}/wheel-test"
          uv pip install --python "${RUNNER_TEMP}/wheel-test/bin/python" dist/*.whl
          "${RUNNER_TEMP}/wheel-test/bin/python" -c "import hirundo._generated.wire_models"

  record-integration:
    name: record integration (ubuntu-latest, 3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Require recording credentials
        env:
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        run: >-
          uv run python -c "import os, sys;
          required = ('HIRUNDO_API_HOST', 'HIRUNDO_API_KEY', 'GCP_CREDENTIALS',
          'AWS_ACCESS_KEY', 'AWS_SECRET_ACCESS_KEY', 'HUGGINGFACE_ACCESS_TOKEN');
          missing = [name for name in required if not os.environ.get(name)];
          sys.exit('missing recording credentials: ' + ', '.join(missing) if missing else 0)"
      - name: Fetch deployed OpenAPI snapshot
        id: schema
        env:
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
        shell: bash
        run: |
          digest=$(uv run python scripts/fetch_openapi_snapshot.py "${RUNNER_TEMP}/openapi.json")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Require deployed schema to match generated models
        shell: bash
        run: diff --brief schemas/openapi_snapshot.json "${RUNNER_TEMP}/openapi.json"
      - name: Select an organization for scoped Git API checks
        env:
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
        shell: bash
        run: |
          organization_id=$(uv run python -c "from hirundo._env import API_HOST; from hirundo._generated.wire_models import OrganizationOut; from hirundo._headers import get_headers; from hirundo._http import raise_for_status_with_reason, requests; from hirundo._timeouts import READ_TIMEOUT; response = requests.get(f'{API_HOST}/organization/', headers=get_headers(), timeout=READ_TIMEOUT); raise_for_status_with_reason(response); organizations = [OrganizationOut.model_validate(value) for value in response.json()]; print(organizations[0].id if organizations else '')")
          test -n "${organization_id}"
          echo "::add-mask::${organization_id}"
          echo "RECORDING_ORGANIZATION_ID=${organization_id}" >> "${GITHUB_ENV}"
      - name: Run bounded Schemathesis diagnostic
        continue-on-error: true
        env:
          HTTP_CONTRACT_PILOT: "1"
          SCHEMATHESIS_OPENAPI_URL: ${{ runner.temp }}/openapi.json
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_TOKEN: ${{ secrets.API_KEY2 }}
          HIRUNDO_API_VERSION: "0.3"
        run: uv run python scripts/run_schemathesis_pilot.py
      - name: Record real SDK integration
        env:
          HIRUNDO_LIVE_TESTS: "1"
          HIRUNDO_API_HOST: ${{ secrets.API_HOST2 }}
          HIRUNDO_API_KEY: ${{ secrets.API_KEY2 }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
          HIRUNDO_CASSETTE_DIR: ${{ runner.temp }}/raw-cassettes
          UNIQUE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          mkdir -p "${HIRUNDO_CASSETTE_DIR}"
          echo "RECORDING_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          uv run pytest -m recorded_integration --record-mode=rewrite
          echo "RECORDING_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
      - name: Sanitize and manifest recordings
        env:
          RECORDING_API_KEY: ${{ secrets.API_KEY2 }}
          RECORDING_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          RECORDING_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          RECORDING_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RECORDING_HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        shell: bash
        run: |
          expires_at=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          uv run python -m tests.recording.artifact_cli publish \
            "${RUNNER_TEMP}/raw-cassettes" \
            "${RUNNER_TEMP}/publish-cassettes" \
            --secrets-env RECORDING_API_KEY \
            --secrets-env RECORDING_GCP_CREDENTIALS \
            --secrets-env RECORDING_AWS_ACCESS_KEY \
            --secrets-env RECORDING_AWS_SECRET_ACCESS_KEY \
            --secrets-env RECORDING_HUGGINGFACE_TOKEN \
            --sdk-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --environment designated-saas-test \
            --recording-started-at "${RECORDING_STARTED_AT}" \
            --recording-finished-at "${RECORDING_FINISHED_AT}" \
            --expires-at "${expires_at}" \
            --schema-digest "${{ steps.schema.outputs.digest }}" \
            --test "${TEST_SELECTION}"
      - name: Upload sanitized recording artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.RECORDING_ARTIFACT }}
          path: ${{ runner.temp }}/publish-cassettes
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  replay-integration:
    name: replay integration (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: record-integration
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Download this attempt's sanitized recording
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.RECORDING_ARTIFACT }}
          path: ${{ runner.temp }}/replay-cassettes
      - name: Verify recording provenance and checksums
        run: >-
          uv run python -m tests.recording.artifact_cli verify
          "${{ runner.temp }}/replay-cassettes"
          --sdk-sha "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --schema-path schemas/openapi_snapshot.json
          --test "${TEST_SELECTION}"
      - name: Replay with synthetic credentials and no network
        env:
          HIRUNDO_API_HOST: https://api.example.test
          HIRUNDO_API_KEY: synthetic-replay-key
          HIRUNDO_CASSETTE_DIR: ${{ runner.temp }}/replay-cassettes
          RECORDING_ORGANIZATION_ID: "1"
          UNIQUE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run pytest -m recorded_integration --record-mode=none --block-network
